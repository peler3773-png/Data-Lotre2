<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>729 3D — Pasti Lengkap & Unik</title>
<style>
:root{--hitam:#050505; --emas:#d4af37; --emas2:#f0c808; --gelap:#1a1a1a; --gelap2:#252525; --teks:#eae0c8}
*{margin:0; padding:0; box-sizing:border-box; font-family:system-ui,sans-serif}
body{background:var(--hitam); color:var(--teks); min-height:100vh; padding:15px}
.wrap{max-width:950px; margin:0 auto}
h1{color:var(--emas); text-align:center; margin:12px 0; font-size:1.35rem}
.card{background:var(--gelap); border:1px solid var(--emas); border-radius:10px; padding:15px; margin:12px 0}
pre{background:#000; padding:15px; border-radius:8px; font-size:0.9rem; line-height:1.8; color:#fff; white-space:pre-wrap; word-break:break-all; max-height:900px; overflow-y:auto; margin:0}
button{background:linear-gradient(135deg,var(--emas),var(--emas2)); color:#000; border:none; padding:9px 14px; border-radius:6px; font-weight:bold; cursor:pointer; margin:4px}
button:hover{transform:scale(1.03)}
select{background:var(--gelap2); color:var(--teks); border:1px solid var(--emas); padding:8px 12px; border-radius:6px; font-weight:bold; cursor:pointer; outline:none; margin:4px}
select:focus{border-color:var(--emas2); box-shadow:0 0 5px var(--emas)}
.loading{text-align:center; padding:25px; color:var(--emas)}
.tombol-baris{text-align:center; margin:10px; display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap}
.info-kecil{font-size:0.8rem; opacity:0.7; margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
<h1>🔮 729 3D — PASTI 729 UNIK</h1>
<div class="tombol-baris">
  <label>Pasaran:</label>
  <select id="pilihPasaran" onchange="tampilPasaran()">
    <option value="CLF">CLF — CALIFORNIA</option>
    <option value="NCE">NCE — NORTH CAROLINA</option>
    <option value="BE">BE — BULLSEYE</option>
    <option value="SD">SD — SYDNEY</option>
    <option value="SGP">SGP — SINGAPORE</option>
    <option value="PS">PS — PHILIPPINES</option>
    <option value="TM">TM — TENNESSE MORNING</option>
    <option value="TXM">TXM — TEXAS MORNING</option>
    <option value="HK">HK — HONGKONG</option>
  </select>
  <button onclick="mulai()">🔄 Muat Ulang</button>
  <span id="terakhirMuat" class="info-kecil">Terakhir: —</span>
</div>
<div id="status" class="loading">⏳ Memuat data & menyusun angka...</div>
<div id="konten" style="display:none">
  <div class="card">
    <h3>📋 Hasil Format Teks</h3>
    <pre id="kotakTeks"></pre>
  </div>
</div>
</div>
<script>
const PENGATURAN_URL = "https://raw.githubusercontent.com/peler3773-png/Data-Lotre/main/pengaturan.json";
const DATA_UNDIAN_URL = "https://raw.githubusercontent.com/peler3773-png/Data-Lotre/main/data_undian.txt";
const MAKSIMAL_90 = 90;
const MAKSIMAL_JML = 2;
const MAKSIMAL_SHIO = 2;
const ATAS = 200, TENGAH = 300, BAWAH = 300;
const TARGET_729 = 729;
let dataShio = {};
let semuaData = [];

function jumlahSatuDigit(angkaStr){
  let nilai = String(angkaStr).split('').reduce((a,b)=>a+parseInt(b),0);
  while(nilai >= 10) nilai = String(nilai).split('').reduce((a,b)=>a+parseInt(b),0);
  return nilai;
}
function urai4Digit(angka4){
  const s = String(angka4).padStart(4,'0');
  return {asli:s, d2:s.slice(0,2), t2:s.slice(1,3), b2:s.slice(2,4)};
}
function cariShioInfo(angka2){
  if(!dataShio) return null;
  let urut=1;
  for(const [shio,d] of Object.entries(dataShio)){
    if(d.angka.includes(angka2)) return urut;
    urut++;
  }
  return null;
}
function urutPalingJarang(daftarAngka, hindari, jumlahAmbil){
  const hitung = {};
  daftarAngka.forEach(a=>{ hitung[a] = (hitung[a]||0)+1; });
  const urutJarang = Object.entries(hitung)
    .filter(([angka])=> angka !== hindari)
    .sort((a,b)=>a[1] - b[1])
    .map(x=>x[0]);
  const hasil = [...urutJarang];
  const sudah = new Set(hasil);
  sudah.add(hindari);
  for(let n=0; n<=99; n++){
    const cek = String(n).padStart(2,'0');
    if(!sudah.has(cek)){
      hasil.push(cek);
      sudah.add(cek);
      if(hasil.length === jumlahAmbil) break;
    }
  }
  return hasil.slice(0, jumlahAmbil);
}
function acakDaftar(arr){
  const salin = [...arr];
  for(let i = salin.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [salin[i], salin[j]] = [salin[j], salin[i]];
  }
  return salin;
}

// === 34D — murni dari 90 2DD/2DT/2DB ===
function buat34D(pilihD2, pilihT2, pilihB2){
  const digitAkhirT2 = pilihT2.map(x => x.slice(-1));
  const digitAkhirB2 = pilihB2.map(x => x.slice(-1));
  const daftar34D = [];
  const sudah = new Set();
  for(const d2 of pilihD2){
    for(const t of digitAkhirT2){
      for(const b of digitAkhirB2){
        const gabung = d2 + t + b;
        if(!sudah.has(gabung)){
          sudah.add(gabung);
          daftar34D.push(gabung);
        }
      }
    }
  }
  const acak = acakDaftar(daftar34D);
  const dipakai = new Set();
  function ambilBagian(jumlah){
    const hasil = [];
    for(const nomor of acak){
      if(!dipakai.has(nomor)){
        hasil.push(nomor);
        dipakai.add(nomor);
        if(hasil.length === jumlah) break;
      }
    }
    return hasil;
  }
  return {
    atas: ambilBagian(ATAS),
    tengah: ambilBagian(TENGAH),
    bawah: ambilBagian(BAWAH),
    totalAsli: daftar34D.length
  };
}

// === PERBAIKAN: 729 4D & 3D PASTI 729 UNIK ===
function buat729Lengkap(pilihD2, pilihT2, pilihB2){
  // Ambil 9 unik dari masing-masing — sumber murni dari daftar 90
  const ambil9Unik = daftar => acakDaftar([...new Set(daftar)]).slice(0,9);
  const d9 = ambil9Unik(pilihD2);
  const t9 = ambil9Unik(pilihT2);
  const b9 = ambil9Unik(pilihB2);

  const daftar4D = [];
  const daftar3D = [];
  const sudah4D = new Set();
  const sudah3D = new Set();

  // Gabungkan semua 9×9×9 = 729 kombinasi → pasti pas 729
  for(const d2 of d9){
    for(const t2 of t9){
      for(const b2 of b9){
        const a4 = d2 + t2.slice(-1) + b2.slice(-1);
        const a3 = a4.slice(1);
        // Cek ganda
        if(!sudah4D.has(a4)){
          sudah4D.add(a4);
          daftar4D.push(a4);
        }
        if(!sudah3D.has(a3)){
          sudah3D.add(a3);
          daftar3D.push(a3);
        }
      }
    }
  }

  // Jika 3D kurang karena ada yang ganda, tambah dari daftar lain yang belum ada
  if(daftar3D.length < TARGET_729){
    // Gabungkan semua digit yang tersedia dari daftar asli
    const semuaDigitT = [...new Set(pilihT2.map(x=>x.slice(-1)))];
    const semuaDigitB = [...new Set(pilihB2.map(x=>x.slice(-1)))];
    const semuaD1 = [...new Set(pilihD2.map(x=>x[0]))];
    const semuaD2 = [...new Set(pilihD2.map(x=>x[1]))];
    // Buat tambahan sampai genap 729
    for(const d1 of semuaD1){
      for(const d2 of semuaD2){
        for(const t of semuaDigitT){
          const calon = d2 + t;
          for(const b of semuaDigitB){
            const a3 = calon + b;
            if(!sudah3D.has(a3)){
              sudah3D.add(a3);
              daftar3D.push(a3);
              if(daftar3D.length === TARGET_729) break;
            }
          }
          if(daftar3D.length === TARGET_729) break;
        }
        if(daftar3D.length === TARGET_729) break;
      }
      if(daftar3D.length === TARGET_729) break;
    }
  }

  return {
    daftar4D: acakDaftar(daftar4D),
    daftar3D: acakDaftar(daftar3D.slice(0, TARGET_729))
  };
}

function susunHasil(dataPasaran){
  if(dataPasaran.length < 3) return null;
  const urutanD2 = [], urutanT2 = [], urutanB2 = [];
  for(const d of dataPasaran){
    const u = urai4Digit(d.angka);
    urutanD2.push(u.d2);
    urutanT2.push(u.t2);
    urutanB2.push(u.b2);
  }
  const terbaru = urai4Digit(dataPasaran[0].angka);
  const pilihD2 = urutPalingJarang(urutanD2, terbaru.d2, MAKSIMAL_90);
  const pilihT2 = urutPalingJarang(urutanT2, terbaru.t2, MAKSIMAL_90);
  const pilihB2 = urutPalingJarang(urutanB2, terbaru.b2, MAKSIMAL_90);

  const bagi34D = buat34D(pilihD2, pilihT2, pilihB2);
  const {daftar4D, daftar3D} = buat729Lengkap(pilihD2, pilihT2, pilihB2);

  const hitungJmlD2 = {};
  pilihD2.forEach(a=>{ const j=jumlahSatuDigit(a); hitungJmlD2[j]=(hitungJmlD2[j]||0)+1; });
  const unikJmlD2 = Object.entries(hitungJmlD2).sort((a,b)=>a[1]-b[1]).map(x=>Number(x[0])).slice(0, MAKSIMAL_JML);

  const hitungJmlT2 = {};
  pilihT2.forEach(a=>{ const j=jumlahSatuDigit(a); hitungJmlT2[j]=(hitungJmlT2[j]||0)+1; });
  const unikJmlT2 = Object.entries(hitungJmlT2).sort((a,b)=>a[1]-b[1]).map(x=>Number(x[0])).slice(0, MAKSIMAL_JML);

  const hitungJmlB2 = {};
  pilihB2.forEach(a=>{ const j=jumlahSatuDigit(a); hitungJmlB2[j]=(hitungJmlB2[j]||0)+1; });
  const unikJmlB2 = Object.entries(hitungJmlB2).sort((a,b)=>a[1]-b[1]).map(x=>Number(x[0])).slice(0, MAKSIMAL_JML);

  const hitungShioD2 = {};
  pilihD2.map(a=>cariShioInfo(a)).filter(Boolean).forEach(s=>{ hitungShioD2[s]=(hitungShioD2[s]||0)+1; });
  const unikShioD2 = Object.entries(hitungShioD2).sort((a,b)=>a[1]-b[1]).map(x=>Number(x[0])).slice(0, MAKSIMAL_SHIO);

  const hitungShioT2 = {};
  pilihT2.map(a=>cariShioInfo(a)).filter(Boolean).forEach(s=>{ hitungShioT2[s]=(hitungShioT2[s]||0)+1; });
  const unikShioT2 = Object.entries(hitungShioT2).sort((a,b)=>a[1]-b[1]).map(x=>Number(x[0])).slice(0, MAKSIMAL_SHIO);

  const hitungShioB2 = {};
  pilihB2.map(a=>cariShioInfo(a)).filter(Boolean).forEach(s=>{ hitungShioB2[s]=(hitungShioB2[s]||0)+1; });
  const unikShioB2 = Object.entries(hitungShioB2).sort((a,b)=>a[1]-b[1]).map(x=>Number(x[0])).slice(0, MAKSIMAL_SHIO);

  return {terbaru, pilihD2, pilihT2, pilihB2, bagi34D, daftar4D, daftar3D, unikJmlD2, unikShioD2, unikJmlT2, unikShioT2, unikJmlB2, unikShioB2};
}

async function ambilTeks(url){
  const r = await fetch(url,{cache:'no-store'});
  if(!r.ok) throw new Error("Gagal ambil: "+url);
  return r.text();
}
async function ambilJSON(url){
  const r = await fetch(url,{cache:'no-store'});
  if(!r.ok) throw new Error("Gagal ambil JSON: "+url);
  return r.json();
}
function parseDataUndian(teks){
  return teks.trim().split('\n').filter(b=>b.trim()).map(b=>{
    const bagian = b.split('|');
    return {
      pasaran: bagian[0].trim(),
      tanggal: bagian[1].trim(),
      angka: String(bagian[2]).padStart(4,'0')
    };
  }).sort((a,b)=>a.tanggal.localeCompare(b.tanggal)).reverse();
}
function tampilPasaran(){
  const kode = document.getElementById('pilihPasaran').value;
  const dp = semuaData.filter(d=>d.pasaran === kode);
  const hasil = susunHasil(dp);

  if(!hasil){
    document.getElementById('kotakTeks').textContent = "⚠️ Data kurang, butuh minimal 3 baris";
    return;
  }

  let teks = `=== ${kode} — 729 3D LENGKAP ===\n`;
  teks += `Hasil Terakhir: ${hasil.terbaru.asli}\n`;
  teks += `Jumlah 3D: ${hasil.daftar3D.length} ✅\n\n`;

  teks += `-- 90 2DD --\n${hasil.pilihD2.join('*')}\nJML-LMH-2DD:   ${hasil.unikJmlD2.join('*')}\nSHIO-LMH-2DD:  ${hasil.unikShioD2.join(',')}\n\n`;
  teks += `-- 90 2DT --\n${hasil.pilihT2.join('*')}\nJML-LMH-2DT:   ${hasil.unikJmlT2.join('*')}\nSHIO-LMH-2DT:  ${hasil.unikShioT2.join(',')}\n\n`;
  teks += `-- 90 2DB --\n${hasil.pilihB2.join('*')}\nJML-LMH-2DB:   ${hasil.unikJmlB2.join('*')}\nSHIO-LMH-2DB:  ${hasil.unikShioB2.join(',')}\n\n`;

  teks += `-- 34D 200 TERATAS --\n${hasil.bagi34D.atas.join('*')}\n\n`;
  teks += `-- 34D 300 TENGAH --\n${hasil.bagi34D.tengah.join('*')}\n\n`;
  teks += `-- 34D 300 TERBAWAH --\n${hasil.bagi34D.bawah.join('*')}\n\n`;

  teks += `-- 729 4D --\n${hasil.daftar4D.join('*')}\n\n`;
  teks += `-- 729 3D --\n${hasil.daftar3D.join('*')}\n`;

  document.getElementById('kotakTeks').textContent = teks;
}
async function mulai(){
  try{
    document.getElementById('status').style.display='block';
    document.getElementById('konten').style.display='none';
    document.getElementById('status').innerHTML='⏳ Memuat data...';
    const pengaturan = await ambilJSON(PENGATURAN_URL);
    dataShio = pengaturan.data_shio;
    semuaData = parseDataUndian(await ambilTeks(DATA_UNDIAN_URL));
    document.getElementById('terakhirMuat').textContent='Terakhir: '+new Date().toLocaleString('id-ID');
    document.getElementById('status').style.display='none';
    document.getElementById('konten').style.display='block';
    tampilPasaran();
  }catch(err){
    document.getElementById('status').innerHTML=`❌ ${err.message}`;
  }
}
document.addEventListener('DOMContentLoaded', mulai);
</script>
</body>
</html>
