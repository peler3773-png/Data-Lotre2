<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D DEPAN & 3D BELAKANG — Tepat 90</title>
<style>
:root{--hitam:#050505; --emas:#d4af37; --emas2:#f0c808; --gelap:#1a1a1a; --gelap2:#252525; --teks:#eae0c8}
*{margin:0; padding:0; box-sizing:border-box; font-family:system-ui,sans-serif}
body{background:var(--hitam); color:var(--teks); min-height:100vh; padding:15px}
.wrap{max-width:950px; margin:0 auto}
h1{color:var(--emas); text-align:center; margin:12px 0; font-size:1.35rem}
.card{background:var(--gelap); border:1px solid var(--emas); border-radius:10px; padding:15px; margin:12px 0}
pre{background:#000; padding:15px; border-radius:8px; font-size:0.9rem; line-height:1.8; color:#fff; white-space:pre-wrap; word-break:break-all; max-height:750px; overflow-y:auto; margin:0}
button{background:linear-gradient(135deg,var(--emas),var(--emas2)); color:#000; border:none; padding:9px 14px; border-radius:6px; font-weight:bold; cursor:pointer; margin:4px}
button:hover{transform:scale(1.03)}
select{background:var(--gelap2); color:var(--teks); border:1px solid var(--emas); padding:8px 12px; border-radius:6px; font-weight:bold; cursor:pointer; outline:none; margin:4px}
select:focus{border-color:var(--emas2); box-shadow:0 0 5px var(--emas)}
.loading{text-align:center; padding:25px; color:var(--emas)}
.tombol-baris{text-align:center; margin:10px; display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap}
.info-kecil{font-size:0.8rem; opacity:0.7; margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
<h1>🔮 3D DEPAN · 3D BELAKANG — Tepat 90</h1>
<div class="tombol-baris">
  <label>Pasaran:</label>
  <select id="pilihPasaran" onchange="tampilPasaran()">
    <option value="CLF">CLF — CALIFORNIA</option>
    <option value="NCE">NCE — NORTH CAROLINA</option>
    <option value="BE">BE — BULLSEYE</option>
    <option value="SD">SD — SYDNEY</option>
    <option value="SGP">SGP — SINGAPORE</option>
    <option value="PS">PS — PHILIPPINES</option>
    <option value="TM">TM — TENNESSE MORNING</option>
    <option value="TXM">TXM — TEXAS MORNING</option>
    <option value="HK">HK — HONGKONG</option>
  </select>
  <button onclick="mulai()">🔄 Muat Ulang</button>
  <span id="terakhirMuat" class="info-kecil">Terakhir: —</span>
</div>
<div id="status" class="loading">⏳ Memuat data & menyusun angka...</div>
<div id="konten" style="display:none">
  <div class="card">
    <h3>📋 Hasil</h3>
    <pre id="kotakTeks"></pre>
  </div>
</div>
</div>
<script>
const DATA_UNDIAN_URL = "https://raw.githubusercontent.com/peler3773-png/Data-Lotre/main/data_undian.txt";
const TARGET_2D = 90;
let semuaData = [];

function urai4Digit(angka4){
  const s = String(angka4).padStart(4,'0');
  return {asli:s, d2:s.slice(0,2), t2:s.slice(1,3), b2:s.slice(2,4)};
}

// === AMBIL TEPAT 90 — TIDAK LEBIH, TIDAK KURANG ===
function ambil90(daftar, hindari){
  // Hitung frekuensi → urut dari yang paling jarang
  const hitung = {};
  daftar.forEach(x => { hitung[x] = (hitung[x] || 0) + 1; });
  
  const hasil = [];
  const sudah = new Set();
  
  // Langkah 1: ambil yang sudah ada, kecuali nomor terakhir
  Object.entries(hitung)
    .filter(([nomor]) => nomor !== hindari)
    .sort((a, b) => a[1] - b[1])
    .forEach(([nomor]) => {
      if(!sudah.has(nomor) && hasil.length < TARGET_2D){
        hasil.push(nomor);
        sudah.add(nomor);
      }
    });
  
  // Langkah 2: isi nomor yang belum ada SAMPAI TEPAT 90
  for(let i = 0; i <= 99; i++){
    const nomor = String(i).padStart(2, '0');
    if(nomor === hindari) continue;
    if(!sudah.has(nomor)){
      hasil.push(nomor);
      sudah.add(nomor);
      if(hasil.length === TARGET_2D) break; // BERHENTI TEPAT DI 90
    }
  }
  
  return hasil; // → SELALU 90 item
}

function acak(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// === 3D DEPAN = A(2DD[0]) + 2DT ===
function buatDepan(dd90, dt90){
  const set = new Set();
  const list = [];
  for(const dd of dd90){
    const A = dd[0];
    for(const dt of dt90){
      const gab = A + dt;
      if(!set.has(gab)){
        set.add(gab);
        list.push(gab);
      }
    }
  }
  return acak(list);
}

// === 3D BELAKANG = C(2DT[0]) + 2DB ===
function buatBelakang(dt90, db90){
  const set = new Set();
  const list = [];
  for(const dt of dt90){
    const C = dt[0];
    for(const db of db90){
      const gab = C + db;
      if(!set.has(gab)){
        set.add(gab);
        list.push(gab);
      }
    }
  }
  return acak(list);
}

function proses(dataPasaran){
  if(dataPasaran.length < 3) return null;
  const d2List = [], t2List = [], b2List = [];
  for(const r of dataPasaran){
    const u = urai4Digit(r.angka);
    d2List.push(u.d2);
    t2List.push(u.t2);
    b2List.push(u.b2);
  }
  const terbaru = urai4Digit(dataPasaran[0].angka);
  
  // SEMUA DIJAMIN TEPAT 90
  const dd90 = ambil90(d2List, terbaru.d2);
  const dt90 = ambil90(t2List, terbaru.t2);
  const db90 = ambil90(b2List, terbaru.b2);
  
  if(dd90.length !== 90 || dt90.length !== 90 || db90.length !== 90){
    console.warn("Peringatan: jumlah tidak 90", dd90.length, dt90.length, db90.length);
  }
  
  const depan = buatDepan(dd90, dt90);
  const belakang = buatBelakang(dt90, db90);
  
  return {terbaru, dd90, dt90, db90, depan, belakang};
}

async function muatTeks(url){
  const res = await fetch(url, {cache:'no-store'});
  if(!res.ok) throw new Error("Gagal ambil data");
  return res.text();
}

function parseTeks(teks){
  return teks.trim().split('\n').filter(b => b.trim()).map(b => {
    const p = b.split('|');
    return {
      pasaran: p[0].trim(),
      tanggal: p[1].trim(),
      angka: String(p[2]).padStart(4,'0')
    };
  }).sort((a, b) => a.tanggal.localeCompare(b.tanggal)).reverse();
}

function tampilPasaran(){
  const kode = document.getElementById('pilihPasaran').value;
  const data = semuaData.filter(x => x.pasaran === kode);
  const h = proses(data);
  
  if(!h){
    document.getElementById('kotakTeks').textContent = "⚠️ Data kurang, minimal 3 baris";
    return;
  }
  
  let out = `${kode}\nTerakhir: ${h.terbaru.asli}\n\n`;
  out += `-- 90 2DD (${h.dd90.length}) --\n${h.dd90.join('*')}\n\n`;
  out += `-- 90 2DT (${h.dt90.length}) --\n${h.dt90.join('*')}\n\n`;
  out += `-- 90 2DB (${h.db90.length}) --\n${h.db90.join('*')}\n\n`;
  out += `-- 3D DEPAN ${h.depan.length} LN --\n`;
  out += `Rumus: A(2DD[0]) + 2DT = A CD\n`;
  out += h.depan.join('*') + `\n\n`;
  out += `-- 3D BELAKANG ${h.belakang.length} LN --\n`;
  out += `Rumus: C(2DT[0]) + 2DB = C EF\n`;
  out += h.belakang.join('*');
  
  document.getElementById('kotakTeks').textContent = out;
}

async function mulai(){
  try{
    document.getElementById('status').style.display = 'block';
    document.getElementById('konten').style.display = 'none';
    document.getElementById('status').innerHTML = '⏳ Memuat data...';
    semuaData = parseTeks(await muatTeks(DATA_UNDIAN_URL));
    document.getElementById('terakhirMuat').textContent = 'Terakhir: ' + new Date().toLocaleString('id-ID');
    document.getElementById('status').style.display = 'none';
    document.getElementById('konten').style.display = 'block';
    tampilPasaran();
  }catch(err){
    document.getElementById('status').innerHTML = `❌ ${err.message}`;
  }
}
document.addEventListener('DOMContentLoaded', mulai);
</script>
</body>
</html>
