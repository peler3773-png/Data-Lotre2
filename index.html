<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>81 Prediksi | Frekuensi</title>
<style>
:root{--hitam:#050505; --emas:#d4af37; --emas2:#f0c808; --gelap:#1a1a1a; --gelap2:#252525; --teks:#eae0c8; --hijau:#4f4; --merah:#f66}
*{margin:0; padding:0; box-sizing:border-box; font-family:system-ui,sans-serif}
body{background:var(--hitam); color:var(--teks); min-height:100vh; padding:15px}
.wrap{max-width:950px; margin:0 auto}
h1{color:var(--emas); text-align:center; margin:12px 0; font-size:1.4rem}
.card{background:var(--gelap); border:1px solid var(--emas); border-radius:10px; padding:15px; margin:12px 0}
pre{background:#000; padding:15px; border-radius:8px; font-size:0.9rem; line-height:1.7; color:#fff; white-space:pre-wrap; word-break:break-all; max-height:800px; overflow-y:auto}
button{background:linear-gradient(135deg,var(--emas),var(--emas2)); color:#000; border:none; padding:9px 14px; border-radius:6px; font-weight:bold; cursor:pointer; margin:4px}
button:hover{transform:scale(1.03)}
button.salin{float:right; margin:-5px 0 10px 0}
select{background:var(--gelap2); color:var(--teks); border:1px solid var(--emas); padding:8px 12px; border-radius:6px; font-weight:bold; cursor:pointer; outline:none; margin:4px}
select:focus{border-color:var(--emas2); box-shadow:0 0 5px var(--emas)}
.loading{text-align:center; padding:25px; color:var(--emas)}
.tombol-baris{text-align:center; margin:10px; display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap}
.sukses{color:var(--hijau); margin-left:8px}
.info-kecil{font-size:0.8rem; opacity:0.7; margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
<h1>🔮 81 PREDIKSI — Lengkap</h1>
<div class="tombol-baris">
  <label>Pasaran:</label>
  <select id="pilihPasaran" onchange="tampilPasaran()">
    <option value="CLF">CLF — CALIFORNIA</option>
    <option value="NCE">NCE — NORTH CAROLINA</option>
    <option value="BE">BE — BULLSEYE</option>
    <option value="SD">SD — SYDNEY</option>
    <option value="SGP">SGP — SINGAPORE</option>
    <option value="PS">PS — PHILIPPINES</option>
    <option value="HK">HK — HONGKONG</option>
  </select>
  <button onclick="mulai()">🔄 Muat Ulang</button>
  <span id="terakhirMuat" class="info-kecil">Terakhir: —</span>
</div>
<div id="status" class="loading">⏳ Memuat data & menyusun 81 angka...</div>
<div id="konten" style="display:none">
  <div class="card">
    <h3>📋 Hasil Format Teks</h3>
    <button class="salin" onclick="salinTeks()">📋 Salin</button>
    <pre id="kotakTeks"></pre>
    <span id="pesanSalin"></span>
  </div>
</div>
</div>

<script>
const PENGATURAN_URL = "https://raw.githubusercontent.com/peler3773-png/Data-Lotre/main/pengaturan.json";
const DATA_UNDIAN_URL = "https://raw.githubusercontent.com/peler3773-png/Data-Lotre/main/data_undian.txt";
const MAKSIMAL_ANGKA = 88;
const MAKSIMAL_JML = 2;   // ✅ JML = 2 DIGIT
const MAKSIMAL_SHIO = 2;  // ✅ SHIO = 2 DIGIT

let dataShio = {};
let semuaData = [];

function ambilUnik(list){ return [...new Set(list)]; }
function ambilTeratas(list, jumlah){ return list.slice(0, jumlah); }

function jumlahSatuDigit(angkaStr){
  let nilai = String(angkaStr).split('').reduce((a,b)=>a+parseInt(b),0);
  while(nilai >= 10) nilai = String(nilai).split('').reduce((a,b)=>a+parseInt(b),0);
  return nilai;
}

function urai4Digit(angka4){
  const s = String(angka4).padStart(4,'0');
  return {asli:s, d2:s.slice(0,2), t2:s.slice(1,3), b2:s.slice(2,4)};
}

function cariShioInfo(angka2){
  if(!dataShio) return null;
  let urut=1;
  for(const [shio,d] of Object.entries(dataShio)){
    if(d.angka.includes(angka2)) return urut;
    urut++;
  }
  return null;
}

function hitungFrekuensi(daftarAngka){
  const hitung = {};
  daftarAngka.forEach(a=>{ hitung[a] = (hitung[a]||0)+1; });
  return Object.entries(hitung).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
}

function ambil81Angka(daftarAngka, hindari){
  const hasil = [];
  const sudah = new Set();
  const urutSering = hitungFrekuensi(daftarAngka.slice(1));

  for(const angka of urutSering){
    if(angka !== hindari && !sudah.has(angka)){
      hasil.push(angka);
      sudah.add(angka);
      if(hasil.length === MAKSIMAL_ANGKA) return hasil;
    }
  }

  for(let n=0; n<=99; n++){
    const cek = String(n).padStart(2,'0');
    if(cek !== hindari && !sudah.has(cek)){
      hasil.push(cek);
      sudah.add(cek);
      if(hasil.length === MAKSIMAL_ANGKA) return hasil;
    }
  }
  return hasil;
}

function susunHasil(dataPasaran){
  if(dataPasaran.length < 3) return null;

  const urutanD2 = [], urutanT2 = [], urutanB2 = [];
  for(const d of dataPasaran){
    const u = urai4Digit(d.angka);
    urutanD2.push(u.d2);
    urutanT2.push(u.t2);
    urutanB2.push(u.b2);
  }
  
  const terbaru = urai4Digit(dataPasaran[0].angka);
  const pilihD2 = ambil81Angka(urutanD2, terbaru.d2);
  const pilihT2 = ambil81Angka(urutanT2, terbaru.t2);
  const pilihB2 = ambil81Angka(urutanB2, terbaru.b2);
  
  const daftar10 = [];
  for(let i=0; i<10; i++){
    const d2 = pilihD2[i]||"00";
    const t2 = pilihT2[i]||"00";
    const b2 = pilihB2[i]||"00";
    const a4 = d2 + t2.slice(-1) + b2.slice(-1);
    daftar10.push({angka4:a4, angka3:a4.slice(1)});
  }
  
  // ✅ JML = 2 DIGIT SAJA
  const unikJmlD2 = ambilTeratas(ambilUnik(pilihD2.map(a=>jumlahSatuDigit(a))), MAKSIMAL_JML);
  const unikJmlT2 = ambilTeratas(ambilUnik(pilihT2.map(a=>jumlahSatuDigit(a))), MAKSIMAL_JML);
  const unikJmlB2 = ambilTeratas(ambilUnik(pilihB2.map(a=>jumlahSatuDigit(a))), MAKSIMAL_JML);
  
  // ✅ SHIO = 2 DIGIT SAJA
  const unikShioD2 = ambilTeratas(ambilUnik(pilihD2.map(a=>cariShioInfo(a)).filter(Boolean)), MAKSIMAL_SHIO);
  const unikShioT2 = ambilTeratas(ambilUnik(pilihT2.map(a=>cariShioInfo(a)).filter(Boolean)), MAKSIMAL_SHIO);
  const unikShioB2 = ambilTeratas(ambilUnik(pilihB2.map(a=>cariShioInfo(a)).filter(Boolean)), MAKSIMAL_SHIO);
  
  return {terbaru, daftar10, pilihD2, pilihT2, pilihB2, unikJmlD2, unikShioD2, unikJmlT2, unikShioT2, unikJmlB2, unikShioB2};
}

async function ambilTeks(url){
  const r = await fetch(url,{cache:'no-store'});
  if(!r.ok) throw new Error("Gagal ambil: "+url);
  return r.text();
}
async function ambilJSON(url){
  const r = await fetch(url,{cache:'no-store'});
  if(!r.ok) throw new Error("Gagal ambil JSON: "+url);
  return r.json();
}
function parseDataUndian(teks){
  return teks.trim().split('\n').filter(b=>b.trim()).map(b=>{
    const bagian = b.split('|');
    return {
      pasaran: bagian[0].trim(),
      tanggal: bagian[1].trim(),
      angka: String(bagian[2]).padStart(4,'0')
    };
  }).sort((a,b)=>a.tanggal.localeCompare(b.tanggal)).reverse();
}

function tampilPasaran(){
  const kode = document.getElementById('pilihPasaran').value;
  const dp = semuaData.filter(d=>d.pasaran === kode);
  const hasil = susunHasil(dp);
  
  if(!hasil){
    document.getElementById('kotakTeks').textContent = "⚠️ Data kurang, butuh minimal 3 baris";
    return;
  }
  
  let teks = `=== ${kode} — 88 PREDIKSI ===\n`;
  teks += `Hasil Terakhir: ${hasil.terbaru.asli}\n\n`;
  
  teks += `-- 10 TERPILIH --\n`;
  teks += `4D: ${hasil.daftar10.map(p=>p.angka4).join('*')}\n`;
  teks += `3D: ${hasil.daftar10.map(p=>p.angka3).join('*')}\n\n`;
  
  teks += `-- 88 2DD --\n`;
  teks += `2DD: ${hasil.pilihD2.join('*')}\n`;
  teks += `JML-2DD: ${hasil.unikJmlD2.join('*')}\n`;
  teks += `SHIO-2DD: ${hasil.unikShioD2.join(',')}\n\n`;
  
  teks += `-- 88 2DT --\n`;
  teks += `2DT: ${hasil.pilihT2.join('*')}\n`;
  teks += `JML-2DT: ${hasil.unikJmlT2.join('*')}\n`;
  teks += `SHIO-2DT: ${hasil.unikShioT2.join(',')}\n\n`;
  
  teks += `-- 88 2DB --\n`;
  teks += `2DB: ${hasil.pilihB2.join('*')}\n`;
  teks += `JML-2DB: ${hasil.unikJmlB2.join('*')}\n`;
  teks += `SHIO-2DB: ${hasil.unikShioB2.join(',')}\n`;
  
  document.getElementById('kotakTeks').textContent = teks;
}

async function mulai(){
  try{
    document.getElementById('status').style.display='block';
    document.getElementById('konten').style.display='none';
    document.getElementById('status').innerHTML='⏳ Memuat data...';
    const pengaturan = await ambilJSON(PENGATURAN_URL);
    dataShio = pengaturan.data_shio;
    semuaData = parseDataUndian(await ambilTeks(DATA_UNDIAN_URL));
    document.getElementById('terakhirMuat').textContent='Terakhir: '+new Date().toLocaleString('id-ID');
    document.getElementById('status').style.display='none';
    document.getElementById('konten').style.display='block';
    tampilPasaran();
  }catch(err){
    document.getElementById('status').innerHTML=`❌ ${err.message}`;
  }
}
function salinTeks(){
  navigator.clipboard.writeText(document.getElementById('kotakTeks').textContent).then(()=>{
    document.getElementById('pesanSalin').innerHTML='<span class="sukses">✓ Tersalin!</span>';
    setTimeout(()=>document.getElementById('pesanSalin').innerHTML='',2000);
  });
}
document.addEventListener('DOMContentLoaded', mulai);
</script>
</body>
</html>
