<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10 Prediksi | Frekuensi + LSTM</title>
<style>
:root{--hitam:#050505; --emas:#d4af37; --emas2:#f0c808; --gelap:#1a1a1a; --gelap2:#252525; --teks:#eae0c8; --hijau:#4f4; --merah:#f66; --biru:#6af; --ungu:#a6f}
*{margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif}
body{background:var(--hitam); color:var(--teks); min-height:100vh; padding:15px}
.wrap{max-width:900px; margin:0 auto}
h1,h2,h3{color:var(--emas); text-align:center; margin:12px 0}
h1{font-size:1.7rem; border-bottom:2px solid var(--emas); padding-bottom:10px}
.card{background:var(--gelap); border:1px solid var(--emas); border-radius:10px; padding:15px; margin:12px 0}
pre{background:#000; padding:15px; border-radius:8px; font-size:0.95rem; line-height:1.8; color:#fff; white-space:pre-wrap; word-break:break-all; max-height:700px; overflow-y:auto}
button{background:linear-gradient(135deg,var(--emas),var(--emas2)); color:#000; border:none; padding:9px 14px; border-radius:6px; font-weight:bold; cursor:pointer; margin:4px}
button:hover{transform:scale(1.03)}
button.salin{float:right; margin:-5px 0 10px 0}
select{background:var(--gelap2); color:var(--teks); border:1px solid var(--emas); padding:8px 12px; border-radius:6px; font-weight:bold; cursor:pointer; outline:none; margin:4px}
select:focus{border-color:var(--emas2); box-shadow:0 0 5px var(--emas)}
.loading{text-align:center; padding:25px; color:var(--emas)}
.tombol-baris{text-align:center; margin:10px; display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap}
.sukses{color:var(--hijau); margin-left:8px}
.info-kecil{font-size:0.8rem; opacity:0.7; margin-top:4px}
.metode{color:var(--ungu); font-weight:bold}
</style>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.1/dist/tf.min.js"></script>
</head>
<body>
<div class="wrap">
<h1>🔮 10 PREDIKSI — Frekuensi + LSTM</h1>

<div class="tombol-baris">
  <label>Pasaran:</label>
  <select id="pilihPasaran" onchange="tampilPasaran()">
    <option value="CLF">CLF — CALIFORNIA</option>
    <option value="BE">BE — BULLSEYE</option>
    <option value="SGP">SGP — SINGAPORE</option>
    <option value="PS">PS — PHILIPPINES</option>
  </select>
  <label>Metode:</label>
  <select id="pilihMetode" onchange="tampilPasaran()">
    <option value="frekuensi">📊 Frekuensi (Paling Sering Muncul)</option>
    <option value="lstm">🧠 LSTM AI (Pola Urutan)</option>
  </select>
  <button onclick="mulai()">🔄 Muat Ulang</button>
  <span id="terakhirMuat" class="info-kecil">Terakhir: —</span>
</div>

<div id="status" class="loading">Sedang memuat data & menghitung pola...</div>
<div id="konten" style="display:none">

  <div class="card">
    <h3>📋 Hasil Format Teks</h3>
    <button class="salin" onclick="salinTeks()">📋 Salin</button>
    <span class="metode" id="labelMetode"></span>
    <pre id="kotakTeks"></pre>
    <span id="pesanSalin"></span>
  </div>

</div>
</div>

<script>
const PENGATURAN_URL = "https://raw.githubusercontent.com/peler3773-png/Data-Lotre/main/pengaturan.json";
const DATA_UNDIAN_URL = "https://raw.githubusercontent.com/peler3773-png/Data-Lotre/main/data_undian.txt";

let dataShio = {};
let semuaData = [];
let modelD2 = null, modelT2 = null, modelB2 = null;

// === HAPUS NILAI GANDA ===
function ambilUnik(list){ return [...new Set(list)]; }

// === JUMLAH SAMPAI 1 DIGIT ===
function jumlahSatuDigit(angkaStr){
  let nilai = String(angkaStr).split('').reduce((a,b)=>a+parseInt(b),0);
  while(nilai >= 10) nilai = String(nilai).split('').reduce((a,b)=>a+parseInt(b),0);
  return nilai;
}

function urai4Digit(angka4){
  const s = String(angka4).padStart(4,'0');
  return {asli:s, d2:s.slice(0,2), t2:s.slice(1,3), b2:s.slice(2,4)};
}

// === SHIO ===
function cariShioInfo(angka2){
  if(!dataShio) return {no:"-", nama:"-"};
  let urut=1;
  for(const [shio,d] of Object.entries(dataShio)){
    if(d.angka.includes(angka2)) return {no:urut, nama:shio};
    urut++;
  }
  return {no:"-", nama:"-"};
}
function formatShio(s){ return `${s.nama}[${s.no}]-`; }

// ==============================================
// METODE 1: FREKUENSI — Hitung Kemunculan
// ==============================================
function hitungFrekuensi(listAngka){
  const h = {};
  listAngka.forEach(a=>{ h[a]=(h[a]||0)+1; });
  return Object.entries(h).sort((a,b)=>b[1]-a[1]);
}
function ambil10Frekuensi(urutan, hindari){
  const frek = hitungFrekuensi(urutan.slice(1));
  const hasil = [];
  for(const [angka] of frek){
    if(angka !== hindari && hasil.length < 10) hasil.push(angka);
  }
  if(hasil.length < 10){
    const sudah = [...hasil];
    for(let n=0;n<=99;n++){
      const cek = String(n).padStart(2,'0');
      if(!sudah.includes(cek) && cek !== hindari && hasil.length < 10) hasil.push(cek);
    }
  }
  return hasil;
}

// ==============================================
// METODE 2: LSTM — AI Prediksi Urutan
// ==============================================
const PANJANG_URUTAN = 5; // pakai 5 hasil terakhir prediksi berikutnya

function siapkanDataUrutan(daftarAngka2digit){
  const urutanAngka = daftarAngka2digit.map(a=>parseInt(a));
  const set = [...new Set(urutanAngka)].sort((a,b)=>a-b);
  const pemetaan = Object.fromEntries(set.map((v,i)=>[v,i]));
  const totalKelas = set.length;
  if(totalKelas < 3) return null;

  const X=[], y=[];
  for(let i=PANJANG_URUTAN; i<urutanAngka.length; i++){
    const potongan = urutanAngka.slice(i-PANJANG_URUTAN, i).map(v=>pemetaan[v]);
    const target = pemetaan[urutanAngka[i]];
    X.push(potongan); y.push(target);
  }
  return {X,y,pemetaan,totalKelas,urutanAsli:daftarAngka2digit};
}

async function latihLSTM(X, y, totalKelas){
  const xs = tf.tensor2d(X, [X.length, PANJANG_URUTAN]);
  const ys = tf.oneHot(y, totalKelas);

  const model = tf.sequential();
  model.add(tf.layers.embedding({inputDim:totalKelas, outputDim:32, inputLength:PANJANG_URUTAN}));
  model.add(tf.layers.lstm({units:64, dropout:0.15}));
  model.add(tf.layers.dense({units:totalKelas, activation:'softmax'}));
  model.compile({optimizer:'adam', loss:'categoricalCrossentropy', metrics:['accuracy']});

  await model.fit(xs, ys, {epochs:60, batchSize:4, verbose:0});
  xs.dispose(); ys.dispose();
  return model;
}

function prediksi10LSTM(model, data, hindari){
  const {X, pemetaan, urutanAsli} = data;
  const balikPeta = Object.fromEntries(Object.entries(pemetaan).map(([k,v])=>[v,parseInt(k)]));
  const urutanTerakhir = urutanAsli.slice(0, PANJANG_URUTAN).map(v=>pemetaan[v]);

  const hasil = [];
  const skor = [];
  let urutanSaatIni = [...urutanTerakhir];

  for(let langkah=0; langkah<15 && hasil.length<10; langkah++){
    const pred = model.predict(tf.tensor2d([urutanSaatIni], [1, PANJANG_URUTAN]), {verbose:0});
    const distribusi = pred.dataSync();
    const terurut = Array.from(distribusi).map((p,i)=>({indeks:i, peluang:p})).sort((a,b)=>b.peluang-a.peluang);

    for(const t of terurut){
      const angka2d = String(balikPeta[t.indeks] ?? 0).padStart(2,'0');
      if(angka2d !== hindari && !hasil.includes(angka2d) && hasil.length<10){
        hasil.push(angka2d);
        skor.push(t.peluang.toFixed(3));
      }
    }
    const terbaik = terurut[0].indeks;
    urutanSaatIni = [...urutanSaatIni.slice(1), terbaik];
    pred.dispose();
  }

  // Isi kekurangan
  if(hasil.length < 10){
    const sudah = [...hasil];
    for(let n=0;n<=99;n++){
      const cek = String(n).padStart(2,'0');
      if(!sudah.includes(cek) && cek !== hindari && hasil.length<10) hasil.push(cek);
      if(hasil.length>=10) break;
    }
  }
  return hasil;
}

async function ambil10LSTM(daftarAngka2digit, hindari){
  const data = siapkanDataUrutan(daftarAngka2digit);
  if(!data) return null;
  const model = await latihLSTM(data.X, data.y, data.totalKelas);
  const hasil = prediksi10LSTM(model, data, hindari);
  model.dispose();
  return hasil;
}

// ==============================================
// SUSUN KE FORMAT
// ==============================================
async function susunHasil(dataPasaran, metode){
  if(dataPasaran.length < 8) return null; // butuh data cukup untuk LSTM

  const urutanD2 = [], urutanT2 = [], urutanB2 = [];
  for(const d of dataPasaran){
    const u = urai4Digit(d.angka);
    urutanD2.push(u.d2); urutanT2.push(u.t2); urutanB2.push(u.b2);
  }
  const terbaru = urai4Digit(dataPasaran[0].angka);

  let pilihD2, pilihT2, pilihB2;
  if(metode === 'lstm'){
    pilihD2 = await ambil10LSTM(urutanD2, terbaru.d2);
    pilihT2 = await ambil10LSTM(urutanT2, terbaru.t2);
    pilihB2 = await ambil10LSTM(urutanB2, terbaru.b2);
    if(!pilihD2) return {error: true, pesan:"Data kurang, minimal 8 baris untuk LSTM"};
  }else{
    pilihD2 = ambil10Frekuensi(urutanD2, terbaru.d2);
    pilihT2 = ambil10Frekuensi(urutanT2, terbaru.t2);
    pilihB2 = ambil10Frekuensi(urutanB2, terbaru.b2);
  }

  const daftar = [];
  for(let i=0;i<10;i++){
    const d2 = pilihD2[i]||"00", t2 = pilihT2[i]||"00", b2 = pilihB2[i]||"00";
    const a4 = d2 + t2.slice(-1) + b2.slice(-1);
    daftar.push({
      d2:{angka:d2, jumlah:jumlahSatuDigit(d2), shio:cariShioInfo(d2)},
      t2:{angka:t2, jumlah:jumlahSatuDigit(t2), shio:cariShioInfo(t2)},
      b2:{angka:b2, jumlah:jumlahSatuDigit(b2), shio:cariShioInfo(b2)},
      angka4:a4, angka3:a4.slice(1)
    });
  }
  return {terbaru, daftar};
}

async function ambilTeks(url){ const r=await fetch(url,{cache:'no-store'}); if(!r.ok)throw new Error(url); return r.text(); }
async function ambilJSON(url){ const r=await fetch(url,{cache:'no-store'}); if(!r.ok)throw new Error(url); return r.json(); }
function parseDataUndian(teks){
  return teks.trim().split('\n').filter(b=>b.trim()).map(b=>{
    const bg = b.split('|');
    return {pasaran:bg[0].trim(), tanggal:bg[1].trim(), angka:String(bg[2]).padStart(4,'0')};
  }).sort((a,b)=>a.tanggal.localeCompare(b.tanggal)).reverse();
}

async function tampilPasaran(){
  const kode = document.getElementById('pilihPasaran').value;
  const metode = document.getElementById('pilihMetode').value;
  const dp = semuaData.filter(d=>d.pasaran===kode);

  document.getElementById('labelMetode').textContent = 
    metode==='lstm' ? "🧠 Metode: LSTM AI — Belajar Pola Urutan" : "📊 Metode: Frekuensi — Paling Sering Muncul";

  const hasil = await susunHasil(dp, metode);
  if(!hasil || hasil.error){
    document.getElementById('kotakTeks').textContent = hasil?.pesan || "⚠️ Data kurang, butuh minimal 3 baris";
    return;
  }

  let teks = `=== ${kode} — 10 PREDIKSI ===\n`;
  teks += `Hasil Terakhir: ${hasil.terbaru.asli}\n`;
  teks += `4D: ${hasil.daftar.map(p=>p.angka4).join('*')}\n`;
  teks += `3D: ${hasil.daftar.map(p=>p.angka3).join('*')}\n`;
  teks += `2DD: ${hasil.daftar.map(p=>p.d2.angka).join('*')}\n`;
  teks += `JML-2DD: ${ambilUnik(hasil.daftar.map(p=>p.d2.jumlah)).join('*')}\n`;
  teks += `SHIO-2DD: ${ambilUnik(hasil.daftar.map(p=>formatShio(p.d2.shio))).join('')}\n`;
  teks += `2DT: ${hasil.daftar.map(p=>p.t2.angka).join('*')}\n`;
  teks += `JML-2DT: ${ambilUnik(hasil.daftar.map(p=>p.t2.jumlah)).join('*')}\n`;
  teks += `SHIO-2DT: ${ambilUnik(hasil.daftar.map(p=>formatShio(p.t2.shio))).join('')}\n`;
  teks += `2DB: ${hasil.daftar.map(p=>p.b2.angka).join('*')}\n`;
  teks += `JML-2DB: ${ambilUnik(hasil.daftar.map(p=>p.b2.jumlah)).join('*')}\n`;
  teks += `SHIO-2DB: ${ambilUnik(hasil.daftar.map(p=>formatShio(p.b2.shio))).join('')}\n`;

  document.getElementById('kotakTeks').textContent = teks;
}

async function mulai(){
  try{
    document.getElementById('status').style.display='block';
    document.getElementById('konten').style.display='none';
    document.getElementById('status').innerHTML='⏳ Memuat data...';

    const pengaturan = await ambilJSON(PENGATURAN_URL);
    dataShio = pengaturan.data_shio;
    semuaData = parseDataUndian(await ambilTeks(DATA_UNDIAN_URL));

    document.getElementById('terakhirMuat').textContent='Terakhir: '+new Date().toLocaleString('id-ID');
    document.getElementById('status').style.display='none';
    document.getElementById('konten').style.display='block';
    
    await tampilPasaran();
  }catch(err){
    document.getElementById('status').innerHTML=`❌ ${err.message}`;
    console.error(err);
  }
}
function salinTeks(){
  navigator.clipboard.writeText(document.getElementById('kotakTeks').textContent).then(()=>{
    document.getElementById('pesanSalin').innerHTML='<span class="sukses">✓ Tersalin!</span>';
    setTimeout(()=>document.getElementById('pesanSalin').innerHTML='',2000);
  });
}
document.addEventListener('DOMContentLoaded', mulai);
</script>
</body>
</html>
