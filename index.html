<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10 Prediksi | LSTM Tuning</title>
<style>
:root{--hitam:#050505; --emas:#d4af37; --emas2:#f0c808; --gelap:#1a1a1a; --gelap2:#252525; --teks:#eae0c8; --hijau:#4f4; --merah:#f66; --biru:#6af; --ungu:#a6f}
*{margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif}
body{background:var(--hitam); color:var(--teks); min-height:100vh; padding:15px}
.wrap{max-width:950px; margin:0 auto}
h1,h2,h3{color:var(--emas); text-align:center; margin:12px 0}
h1{font-size:1.7rem; border-bottom:2px solid var(--emas); padding-bottom:10px}
.card{background:var(--gelap); border:1px solid var(--emas); border-radius:10px; padding:15px; margin:12px 0}
pre{background:#000; padding:15px; border-radius:8px; font-size:0.95rem; line-height:1.8; color:#fff; white-space:pre-wrap; word-break:break-all; max-height:700px; overflow-y:auto}
button{background:linear-gradient(135deg,var(--emas),var(--emas2)); color:#000; border:none; padding:9px 14px; border-radius:6px; font-weight:bold; cursor:pointer; margin:4px}
button:hover{transform:scale(1.03)}
button.salin{float:right; margin:-5px 0 10px 0}
select,input{background:var(--gelap2); color:var(--teks); border:1px solid var(--emas); padding:6px 10px; border-radius:6px; font-weight:bold; outline:none; margin:4px; width:90px}
select:focus,input:focus{border-color:var(--emas2); box-shadow:0 0 5px var(--emas)}
label{font-size:0.9rem; margin-left:6px}
.loading{text-align:center; padding:25px; color:var(--emas)}
.tombol-baris{text-align:center; margin:10px; display:flex; justify-content:center; align-items:center; gap:8px; flex-wrap:wrap}
.sukses{color:var(--hijau); margin-left:8px}
.info-kecil{font-size:0.8rem; opacity:0.7; margin-top:4px}
.metode-frek{color:var(--biru); font-weight:bold}
.metode-lstm{color:var(--ungu); font-weight:bold}
.param-box{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; margin-top:10px; padding:10px; background:#0f0f0f; border-radius:8px}
.param-item{text-align:center}
.param-nama{font-size:0.75rem; opacity:0.8}
.error{color:var(--merah); text-align:center; padding:10px}
</style>
<!-- TensorFlow.js — Dipindah ke HEAD & Pakai Versi Stabil Pasti -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script>
// Cek langsung saat halaman dimuat
window.addEventListener('load', function(){
  if(typeof tf === 'undefined'){
    console.error('TensorFlow gagal dimuat');
    const st = document.getElementById('status');
    if(st) st.innerHTML = '❌ TensorFlow gagal dimuat — cek koneksi internet';
  }
});
</script>
</head>
<body>
<div class="wrap">
<h1>🔮 10 PREDIKSI — LSTM Full Tuning</h1>

<div class="tombol-baris">
  <label>Pasaran:</label>
  <select id="pilihPasaran" onchange="tampilPasaran()">
    <option value="CLF" selected>CLF — CALIFORNIA</option>
    <option value="BE">BE — BULLSEYE</option>
    <option value="SGP">SGP — SINGAPORE</option>
    <option value="PS">PS — PHILIPPINES</option>
  </select>
  <label>Metode:</label>
  <select id="pilihMetode" onchange="tampilPasaran()">
    <option value="frekuensi">📊 Frekuensi</option>
    <option value="lstm" selected>🧠 LSTM AI</option>
  </select>
  <button onclick="mulai()">🔄 Muat Ulang</button>
  <span id="terakhirMuat" class="info-kecil">Terakhir: —</span>
</div>

<div class="card" id="panelParam">
  <h3>⚙️ Parameter LSTM</h3>
  <div class="param-box">
    <div class="param-item">
      <div class="param-nama">Panjang Urutan</div>
      <input type="number" id="pPanjang" value="5" min="3" max="15" onchange="tampilPasaran()">
    </div>
    <div class="param-item">
      <div class="param-nama">Epoch</div>
      <input type="number" id="pEpoch" value="80" min="20" max="300" onchange="tampilPasaran()">
    </div>
    <div class="param-item">
      <div class="param-nama">Unit LSTM</div>
      <input type="number" id="pUnit" value="64" min="16" max="256" step="8" onchange="tampilPasaran()">
    </div>
    <div class="param-item">
      <div class="param-nama">Dropout</div>
      <input type="number" id="pDrop" value="0.15" min="0" max="0.5" step="0.05" onchange="tampilPasaran()">
    </div>
    <div class="param-item">
      <div class="param-nama">Embedding</div>
      <input type="number" id="pEmbed" value="32" min="8" max="128" step="8" onchange="tampilPasaran()">
    </div>
  </div>
</div>

<div id="status" class="loading">⏳ Memuat data & melatih model LSTM... Mohon tunggu...</div>
<div id="konten" style="display:none">
  <div class="card">
    <h3>📋 Hasil Format Teks</h3>
    <button class="salin" onclick="salinTeks()">📋 Salin</button>
    <span id="labelMetode"></span>
    <pre id="kotakTeks"></pre>
    <span id="pesanSalin"></span>
  </div>
</div>
</div>

<script>
const PENGATURAN_URL = "https://raw.githubusercontent.com/peler3773-png/Data-Lotre/main/pengaturan.json";
const DATA_UNDIAN_URL = "https://raw.githubusercontent.com/peler3773-png/Data-Lotre/main/data_undian.txt";

let dataShio = {};
let semuaData = [];

// === Baca Parameter ===
function getParam(){
  return {
    panjang: parseInt(document.getElementById('pPanjang').value) || 5,
    epoch: parseInt(document.getElementById('pEpoch').value) || 80,
    unit: parseInt(document.getElementById('pUnit').value) || 64,
    drop: parseFloat(document.getElementById('pDrop').value) || 0.15,
    embed: parseInt(document.getElementById('pEmbed').value) || 32
  };
}

// === HAPUS NILAI GANDA ===
function ambilUnik(list){ return [...new Set(list)]; }

// === JUMLAH SAMPAI 1 DIGIT ===
function jumlahSatuDigit(angkaStr){
  let nilai = String(angkaStr).split('').reduce((a,b)=>a+parseInt(b),0);
  while(nilai >= 10) nilai = String(nilai).split('').reduce((a,b)=>a+parseInt(b),0);
  return nilai;
}

function urai4Digit(angka4){
  const s = String(angka4).padStart(4,'0');
  return {asli:s, d2:s.slice(0,2), t2:s.slice(1,3), b2:s.slice(2,4)};
}

// === SHIO ===
function cariShioInfo(angka2){
  if(!dataShio) return {no:"-", nama:"-"};
  let urut=1;
  for(const [shio,d] of Object.entries(dataShio)){
    if(d.angka.includes(angka2)) return {no:urut, nama:shio};
    urut++;
  }
  return {no:"-", nama:"-"};
}
function formatShio(s){ return `${s.nama}[${s.no}]-`; }

// ==============================================
// METODE 1: FREKUENSI
// ==============================================
function hitungFrekuensi(listAngka){
  const h = {};
  listAngka.forEach(a=>{ h[a]=(h[a]||0)+1; });
  return Object.entries(h).sort((a,b)=>b[1]-a[1]);
}
function ambil10Frekuensi(urutan, hindari){
  const frek = hitungFrekuensi(urutan.slice(1));
  const hasil = [];
  for(const [angka] of frek){
    if(angka !== hindari && hasil.length < 10) hasil.push(angka);
  }
  if(hasil.length < 10){
    const sudah = [...hasil];
    for(let n=0;n<=99;n++){
      const cek = String(n).padStart(2,'0');
      if(!sudah.includes(cek) && cek !== hindari && hasil.length < 10) hasil.push(cek);
    }
  }
  return hasil;
}

// ==============================================
// METODE 2: LSTM — Full Tuning
// ==============================================
function siapkanDataUrutan(daftarAngka2digit, panjangUrutan){
  const urutanAngka = daftarAngka2digit.map(a=>parseInt(a));
  const set = [...new Set(urutanAngka)].sort((a,b)=>a-b);
  const pemetaan = Object.fromEntries(set.map((v,i)=>[v,i]));
  const totalKelas = set.length;
  if(totalKelas < 3 || urutanAngka.length < panjangUrutan + 2) return null;

  const X=[], y=[];
  for(let i=panjangUrutan; i<urutanAngka.length; i++){
    const potongan = urutanAngka.slice(i-panjangUrutan, i).map(v=>pemetaan[v]);
    if(pemetaan[urutanAngka[i]] !== undefined){
      X.push(potongan);
      y.push(pemetaan[urutanAngka[i]]);
    }
  }
  return {X,y,pemetaan,totalKelas,urutanAsli:daftarAngka2digit};
}

async function latihLSTM(X, y, totalKelas, p){
  if(typeof tf === 'undefined') throw new Error('TensorFlow belum dimuat');
  
  const xs = tf.tensor2d(X, [X.length, p.panjang]);
  const ys = tf.oneHot(y, totalKelas);

  const model = tf.sequential();
  model.add(tf.layers.embedding({
    inputDim: totalKelas,
    outputDim: p.embed,
    inputLength: p.panjang
  }));
  model.add(tf.layers.lstm({
    units: p.unit,
    dropout: p.drop
  }));
  model.add(tf.layers.batchNormalization());
  model.add(tf.layers.dense({
    units: totalKelas,
    activation: 'softmax'
  }));
  model.compile({
    optimizer: tf.train.adam(0.001),
    loss: 'categoricalCrossentropy',
    metrics: ['accuracy']
  });

  await model.fit(xs, ys, {
    epochs: p.epoch,
    batchSize: Math.min(8, Math.max(2, Math.floor(X.length/4))),
    validationSplit: 0.1,
    verbose: 0
  });

  const akurasi = model.evaluate(xs, ys, {verbose:0})[1].dataSync()[0];
  xs.dispose(); ys.dispose();
  return {model, akurasi: akurasi.toFixed(3)};
}

function prediksi10LSTM(model, data, hindari, p){
  const {pemetaan, urutanAsli} = data;
  const balikPeta = Object.fromEntries(Object.entries(pemetaan).map(([k,v])=>[v,parseInt(k)]));
  
  const urutanTerakhir = urutanAsli.slice(0, p.panjang).map(v=>pemetaan[v]);
  if(urutanTerakhir.includes(undefined)) return null;

  const hasil = [];
  const pred = model.predict(tf.tensor2d([urutanTerakhir], [1, p.panjang]), {verbose:0});
  const distribusi = pred.dataSync();
  const terurut = Array.from(distribusi)
    .map((peluang, indeks)=>({indeks, peluang}))
    .sort((a,b)=>b.peluang - a.peluang);

  for(const t of terurut){
    const angka2d = String(balikPeta[t.indeks] ?? 0).padStart(2,'0');
    if(angka2d !== hindari && !hasil.includes(angka2d)){
      hasil.push(angka2d);
      if(hasil.length >= 10) break;
    }
  }
  pred.dispose();

  if(hasil.length < 10){
    const sudah = [...hasil];
    for(let n=0;n<=99;n++){
      const cek = String(n).padStart(2,'0');
      if(!sudah.includes(cek) && cek !== hindari){
        hasil.push(cek);
        if(hasil.length >= 10) break;
      }
    }
  }
  return hasil;
}

async function ambil10LSTM(daftarAngka2digit, hindari, p){
  if(typeof tf === 'undefined') return null;
  const data = siapkanDataUrutan(daftarAngka2digit, p.panjang);
  if(!data) return null;
  const {model, akurasi} = await latihLSTM(data.X, data.y, data.totalKelas, p);
  const hasil = prediksi10LSTM(model, data, hindari, p);
  model.dispose();
  return {hasil, akurasi};
}

// ==============================================
// SUSUN FORMAT
// ==============================================
async function susunHasil(dataPasaran, metode){
  const p = getParam();
  if(dataPasaran.length < Math.max(p.panjang + 2, 5)) return null;

  const urutanD2 = [], urutanT2 = [], urutanB2 = [];
  for(const d of dataPasaran){
    const u = urai4Digit(d.angka);
    urutanD2.push(u.d2); urutanT2.push(u.t2); urutanB2.push(u.b2);
  }
  const terbaru = urai4Digit(dataPasaran[0].angka);

  let pilihD2, pilihT2, pilihB2, infoAkurasi="";
  if(metode === 'lstm'){
    if(typeof tf === 'undefined'){
      return {error:true, pesan:"❌ TensorFlow belum dimuat — cek koneksi internet & muat ulang halaman"};
    }
    const d2 = await ambil10LSTM(urutanD2, terbaru.d2, p);
    const t2 = await ambil10LSTM(urutanT2, terbaru.t2, p);
    const b2 = await ambil10LSTM(urutanB2, terbaru.b2, p);
    if(!d2 || !t2 || !b2) return {error:true, pesan:"⚠️ Data tidak cukup untuk parameter saat ini"};
    pilihD2 = d2.hasil; pilihT2 = t2.hasil; pilihB2 = b2.hasil;
    infoAkurasi = ` (Akurasi D2:${d2.akurasi} T2:${t2.akurasi} B2:${b2.akurasi})`;
  }else{
    pilihD2 = ambil10Frekuensi(urutanD2, terbaru.d2);
    pilihT2 = ambil10Frekuensi(urutanT2, terbaru.t2);
    pilihB2 = ambil10Frekuensi(urutanB2, terbaru.b2);
  }

  const daftar = [];
  for(let i=0;i<10;i++){
    const d2 = pilihD2[i]||"00", t2 = pilihT2[i]||"00", b2 = pilihB2[i]||"00";
    const a4 = d2 + t2.slice(-1) + b2.slice(-1);
    daftar.push({
      d2:{angka:d2, jumlah:jumlahSatuDigit(d2), shio:cariShioInfo(d2)},
      t2:{angka:t2, jumlah:jumlahSatuDigit(t2), shio:cariShioInfo(t2)},
      b2:{angka:b2, jumlah:jumlahSatuDigit(b2), shio:cariShioInfo(b2)},
      angka4:a4, angka3:a4.slice(1)
    });
  }
  return {terbaru, daftar, infoAkurasi};
}

async function ambilTeks(url){ const r=await fetch(url,{cache:'no-store'}); if(!r.ok)throw new Error(url); return r.text(); }
async function ambilJSON(url){ const r=await fetch(url,{cache:'no-store'}); if(!r.ok)throw new Error(url); return r.json(); }
function parseDataUndian(teks){
  return teks.trim().split('\n').filter(b=>b.trim()).map(b=>{
    const bg = b.split('|');
    return {pasaran:bg[0].trim(), tanggal:bg[1].trim(), angka:String(bg[2]).padStart(4,'0')};
  }).sort((a,b)=>a.tanggal.localeCompare(b.tanggal)).reverse();
}

async function tampilPasaran(){
  const kode = document.getElementById('pilihPasaran').value;
  const metode = document.getElementById('pilihMetode').value;
  const dp = semuaData.filter(d=>d.pasaran===kode);
  const p = getParam();

  document.getElementById('panelParam').style.display = metode==='lstm' ? 'block' : 'none';
  document.getElementById('labelMetode').className = metode==='lstm' ? 'metode-lstm' : 'metode-frek';
  document.getElementById('labelMetode').textContent = 
    metode==='lstm' ? `🧠 LSTM AI — Panjang:${p.panjang} Epoch:${p.epoch} Unit:${p.unit}` : "📊 Frekuensi — Paling Sering Muncul";

  document.getElementById('status').style.display='block';
  document.getElementById('konten').style.display='none';
  document.getElementById('status').innerHTML=metode==='lstm' ? "⏳ Melatih model LSTM... Tunggu sebentar..." : "⏳ Menghitung...";

  const hasil = await susunHasil(dp, metode);
  
  if(!hasil || hasil.error){
    document.getElementById('status').innerHTML = `<div class="error">${hasil?.pesan || "⚠️ Data kurang"}</div>`;
    return;
  }

  let teks = `=== ${kode} — 10 PREDIKSI ===\n`;
  teks += `Hasil Terakhir: ${hasil.terbaru.asli}${hasil.infoAkurasi}\n`;
  teks += `4D: ${hasil.daftar.map(p=>p.angka4).join('*')}\n`;
  teks += `3D: ${hasil.daftar.map(p=>p.angka3).join('*')}\n`;
  teks += `2DD: ${hasil.daftar.map(p=>p.d2.angka).join('*')}\n`;
  teks += `JML-2DD: ${ambilUnik(hasil.daftar.map(p=>p.d2.jumlah)).join('*')}\n`;
  teks += `SHIO-2DD: ${ambilUnik(hasil.daftar.map(p=>formatShio(p.d2.shio))).join('')}\n`;
  teks += `2DT: ${hasil.daftar.map(p=>p.t2.angka).join('*')}\n`;
  teks += `JML-2DT: ${ambilUnik(hasil.daftar.map(p=>p.t2.jumlah)).join('*')}\n`;
  teks += `SHIO-2DT: ${ambilUnik(hasil.daftar.map(p=>formatShio(p.t2.shio))).join('')}\n`;
  teks += `2DB: ${hasil.daftar.map(p=>p.b2.angka).join('*')}\n`;
  teks += `JML-2DB: ${ambilUnik(hasil.daftar.map(p=>p.b2.jumlah)).join('*')}\n`;
  teks += `SHIO-2DB: ${ambilUnik(hasil.daftar.map(p=>formatShio(p.b2.shio))).join('')}\n`;

  document.getElementById('kotakTeks').textContent = teks;
  document.getElementById('status').style.display='none';
  document.getElementById('konten').style.display='block';
}

async function mulai(){
  try{
    document.getElementById('status').style.display='block';
    document.getElementById('konten').style.display='none';
    document.getElementById('status').innerHTML='⏳ Memuat data...';

    const pengaturan = await ambilJSON(PENGATURAN_URL);
    dataShio = pengaturan.data_shio;
    semuaData = parseDataUndian(await ambilTeks(DATA_UNDIAN_URL));

    document.getElementById('terakhirMuat').textContent='Terakhir: '+new Date().toLocaleString('id-ID');
    
    await tampilPasaran();
  }catch(err){
    document.getElementById('status').innerHTML=`<div class="error">❌ ${err.message}</div>`;
    console.error(err);
  }
}
function salinTeks(){
  navigator.clipboard.writeText(document.getElementById('kotakTeks').textContent).then(()=>{
    document.getElementById('pesanSalin').innerHTML='<span class="sukses">✓ Tersalin!</span>';
    setTimeout(()=>document.getElementById('pesanSalin').innerHTML='',2000);
  });
}
document.addEventListener('DOMContentLoaded', mulai);
</script>
</body>
</html>
