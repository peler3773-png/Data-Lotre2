<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LSTM-JUMLAH-SHIO + PREDIKSI | CLF·BE·SGP·PS</title>
<style>
:root{--hitam:#050505; --emas:#d4af37; --emas2:#f0c808; --gelap:#1a1a1a; --teks:#eae0c8; --hijau:#4f4; --merah:#f66; --biru:#6af}
*{margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif}
body{background:var(--hitam); color:var(--teks); min-height:100vh; padding:15px}
.wrap{max-width:960px; margin:0 auto}
h1,h2,h3{color:var(--emas); text-align:center; margin:12px 0}
h1{font-size:1.7rem; border-bottom:2px solid var(--emas); padding-bottom:10px}
.card{background:var(--gelap); border:1px solid var(--emas); border-radius:10px; padding:15px; margin:12px 0}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(400px,1fr)); gap:12px}
.pasaran-card{border-left:3px solid var(--emas); padding:10px; border-radius:6px}
.label{font-weight:bold; color:var(--emas2)}
.angka{font-size:1.3rem; font-weight:bold; letter-spacing:2px; margin:6px 0}
.libur{opacity:0.6; border-style:dashed}
.tidak-libur{border-left-color:var(--hijau);}
.prediksi{border-left-color:var(--biru); background:#0f1520}
.loading{text-align:center; padding:25px; color:var(--emas)}
.baris{display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid #333; flex-wrap:wrap; gap:4px}
.baris.pred{border-bottom:1px dotted var(--biru)}
button{background:linear-gradient(135deg,var(--emas),var(--emas2)); color:#000; border:none; padding:9px 14px; border-radius:6px; font-weight:bold; cursor:pointer; margin:4px}
button:hover{transform:scale(1.03)}
pre{background:#000; padding:10px; border-radius:6px; overflow-x:auto; font-size:0.85rem; max-height:300px}
.copy-btn{float:right; margin:-2px 0 0 0; padding:4px 8px; font-size:0.8rem}
.sukses{color:var(--hijau); margin-left:8px}
.skor{display:inline-block; width:36px; text-align:center; border-radius:4px; font-weight:bold}
.skor-tinggi{background:#264; color:#fff}
.skor-sedang{background:#442; color:#fe0}
.skor-rendah{background:#422; color:#f88}
.teks-hijau{color:var(--hijau)}
.teks-merah{color:var(--merah)}
.teks-biru{color:var(--biru)}
</style>
</head>
<body>
<div class="wrap">
<h1>🔮 LSTM-JUMLAH-SHIO + PREDIKSI</h1>
<h2>CLF · BE · SGP · PS | 2DD · 2DT · 2DB</h2>
<div id="status" class="loading">Sedang memuat data & menghitung pola...</div>

<div id="konten" style="display:none">
  <div class="card">
    <h3>📅 Jadwal Pasaran</h3>
    <div class="grid" id="jadwalPasaran"></div>
  </div>

  <div class="card">
    <h3>📊 Hasil Terbaru</h3>
    <div class="grid" id="hasilGrid"></div>
  </div>

  <div class="card">
    <h3>🔥 PREDIKSI Angka Berikutnya</h3>
    <div class="grid2" id="prediksiGrid"></div>
  </div>

  <div class="card">
    <h3>🧮 Rekap Lengkap</h3>
    <div id="rekapBagian"></div>
  </div>

  <div class="card">
    <h3>📋 Hasil JSON</h3>
    <button class="copy-btn" onclick="salinJSON()">Salin JSON</button>
    <pre id="jsonHasil"></pre>
    <span id="pesanSalin"></span>
  </div>
</div>
</div>

<script>
const PENGATURAN_URL = "https://raw.githubusercontent.com/peler3773-png/Data-Lotre/main/pengaturan.json";
const DATA_UNDIAN_URL = "https://raw.githubusercontent.com/peler3773-png/Data-Lotre/main/data_undian.txt";

// === PASARAN UTAMA — CLF & BE TANPA LIBUR ===
const PASARAN_DAFTAR = [
  {kode:"CLF", nama:"CALIFORNIA", libur:[]},
  {kode:"BE", nama:"BULLSEYE", libur:[]},
  {kode:"SGP", nama:"SINGAPORE", libur:["Selasa","Jumat"]},
  {kode:"PS", nama:"PHILIPPINES", libur:["Minggu"]}
];

const HARI_IND = ["Senin","Selasa","Rabu","Kamis","Jumat","Sabtu","Minggu"];
let dataShio = {};

// === UTILITAS ===
function ambilHariNama(tanggalStr){
  const d = new Date(tanggalStr + "T00:00:00");
  return HARI_IND[d.getDay()];
}

function isLibur(kodePasaran, tanggalStr){
  const p = PASARAN_DAFTAR.find(x=>x.kode===kodePasaran);
  if(!p) return false;
  const hari = ambilHariNama(tanggalStr);
  return p.libur.length > 0 && p.libur.includes(hari);
}

function urai4Digit(angka4){
  const s = String(angka4).padStart(4,'0');
  return {asli:s, d2:s.slice(0,2), t2:s.slice(1,3), b2:s.slice(2,4)};
}

function cariShio(angka2){
  if(!dataShio) return "-";
  for(const [shio, d] of Object.entries(dataShio)){
    if(d.angka.includes(angka2)) return shio;
  }
  return "-";
}

function jumlahAngka(angkaStr){
  return String(angkaStr).split('').reduce((a,b)=>a+parseInt(b),0);
}

function ambilTeks(url){ return fetch(url).then(r=>{if(!r.ok)throw new Error(url);return r.text()}) }
function ambilJSON(url){ return fetch(url).then(r=>{if(!r.ok)throw new Error(url);return r.json()}) }

function parseDataUndian(teks){
  return teks.trim().split('\n').filter(b=>b.trim()).map(b=>{
    const [pasaran, tgl, angka] = b.split('|');
    return {pasaran, tanggal:tgl, angka:String(angka).padStart(4,'0')};
  }).sort((a,b)=>a.tanggal.localeCompare(b.tanggal)).reverse();
}

// === SISTEM PREDIKSI ===
function hitungPrediksi(dataPasaran){
  if(dataPasaran.length < 3) return null;

  // Kumpulkan semua 2DD/2DT/2DB dari riwayat
  const d2List = [], t2List = [], b2List = [];
  const shioD2 = {}, shioT2 = {}, shioB2 = {};
  const jumlahD2 = {}, jumlahT2 = {}, jumlahB2 = {};
  const urutanD2 = [], urutanT2 = [], urutanB2 = [];

  for(const d of dataPasaran){
    const u = urai4Digit(d.angka);
    d2List.push(u.d2); t2List.push(u.t2); b2List.push(u.b2);
    urutanD2.push(u.d2); urutanT2.push(u.t2); urutanB2.push(u.b2);

    const sD = cariShio(u.d2);
    const sT = cariShio(u.t2);
    const sB = cariShio(u.b2);
    shioD2[sD] = (shioD2[sD]||0)+1;
    shioT2[sT] = (shioT2[sT]||0)+1;
    shioB2[sB] = (shioB2[sB]||0)+1;

    const jD = jumlahAngka(u.d2);
    const jT = jumlahAngka(u.t2);
    const jB = jumlahAngka(u.b2);
    jumlahD2[jD] = (jumlahD2[jD]||0)+1;
    jumlahT2[jT] = (jumlahT2[jT]||0)+1;
    jumlahB2[jB] = (jumlahB2[jB]||0)+1;
  }

  // Hitung frekuensi kemunculan
  const freqD2 = hitungFrekuensi(d2List);
  const freqT2 = hitungFrekuensi(t2List);
  const freqB2 = hitungFrekuensi(b2List);

  // Pola urutan: prediksi berdasarkan urutan terakhir
  const predD2 = prediksiUrutan(urutanD2);
  const predT2 = prediksiUrutan(urutanT2);
  const predB2 = prediksiUrutan(urutanB2);

  // Gabungkan jadi 4 digit
  const prediksi4digit = predD2.angka + predT2.angka.slice(-1) + predB2.angka.slice(-1);

  return {
    pred_dd: predD2,
    pred_dt: predT2,
    pred_db: predB2,
    prediksi_4d: prediksi4digit,
    shio_teratas: {
      d2: Object.entries(shioD2).sort((a,b)=>b[1]-a[1])[0],
      t2: Object.entries(shioT2).sort((a,b)=>b[1]-a[1])[0],
      b2: Object.entries(shioB2).sort((a,b)=>b[1]-a[1])[0]
    },
    jumlah_teratas: {
      d2: Object.entries(jumlahD2).sort((a,b)=>b[1]-a[1])[0],
      t2: Object.entries(jumlahT2).sort((a,b)=>b[1]-a[1])[0],
      b2: Object.entries(jumlahB2).sort((a,b)=>b[1]-a[1])[0]
    },
    frekuensi: {terbanyakD2:freqD2[0], terbanyakT2:freqT2[0], terbanyakB2:freqB2[0]},
    jumlah_data: dataPasaran.length
  };
}

function hitungFrekuensi(list){
  const hitung = {};
  list.forEach(x=>hitung[x]=(hitung[x]||0)+1);
  return Object.entries(hitung).sort((a,b)=>b[1]-a[1]);
}

function prediksiUrutan(urutan){
  // Ambil urutan terakhir & cari pola yang mirip
  const terakhir = urutan[0];
  const riwayat = urutan.slice(1);
  const hitung = {};
  let kemiripan = 0;

  // Cari angka yang muncul setelah urutan yang mirip
  for(let i=0; i<riwayat.length-1; i++){
    hitung[riwayat[i]] = (hitung[riwayat[i]]||0) + (riwayat[i]===terakhir ? 3 : 1);
  }

  // Angka yang belum lama muncul (tren naik)
  const belumMuncul = [];
  for(let n=0; n<=99; n++){
    const num = String(n).padStart(2,'0');
    if(!urutan.slice(0,5).includes(num)) belumMuncul.push(num);
  }

  // Pilih angka utama: frekuensi tinggi + belum lama muncul
  let kandidat = Object.entries(hitung).sort((a,b)=>b[1]-a[1]);
  let angkaAkhir = kandidat.length>0 ? kandidat[0][0] : belumMuncul[0] || "00";
  let skor = kandidat.length>0 ? Math.min(10, Math.round(kandidat[0][1]*2)) : 5;

  // Tambah variasi dari angka yang jarang muncul
  if(belumMuncul.length > 3 && skor < 7){
    angkaAkhir = belumMuncul[Math.floor(Math.random()*Math.min(5,belumMuncul.length))];
    skor = Math.max(4, skor-1);
  }

  return {
    angka: angkaAkhir,
    skor: skor,
    tren: skor >= 7 ? "Naik" : skor >= 4 ? "Stabil" : "Turun",
    alasan: skor >=7 ? "Sering muncul & pola kuat" : "Berdasarkan riwayat"
  };
}

function skorKelas(skor){
  if(skor >=7) return 'skor-tinggi';
  if(skor >=4) return 'skor-sedang';
  return 'skor-rendah';
}

// === UTAMA ===
async function mulai(){
  try{
    const pengaturan = await ambilJSON(PENGATURAN_URL);
    dataShio = pengaturan.data_shio;
    const teksUndian = await ambilTeks(DATA_UNDIAN_URL);
    const semuaData = parseDataUndian(teksUndian);

    // Jadwal
    document.getElementById('jadwalPasaran').innerHTML = PASARAN_DAFTAR.map(p=>`
      <div class="pasaran-card ${p.libur.length===0?'tidak-libur':''}">
        <div class="label">${p.kode} — ${p.nama}</div>
        <div>Buka: ${p.libur.length===0?'Setiap Hari ✅':'Senin–Sabtu'}</div>
        <div style="color:${p.libur.length===0?'var(--hijau)':'var(--merah)'}">
          ${p.libur.length===0?'Tidak Ada Hari Libur':'Libur: '+p.libur.join(', ')}
        </div>
      </div>`).join('');

    // Hasil & Prediksi per pasaran
    const hasilAkhir = [];
    const prediksiDaftar = [];

    for(const p of PASARAN_DAFTAR){
      const dataPasaran = semuaData.filter(d=>d.pasaran===p.kode);
      if(!dataPasaran.length) continue;

      const aktif = dataPasaran.filter(d=>!isLibur(p.kode, d.tanggal));
      const terbaru = aktif[0] || dataPasaran[0];
      const urai = urai4Digit(terbaru.angka);
      const pred = hitungPrediksi(dataPasaran);

      hasilAkhir.push({
        pasaran: p.kode, nama: p.nama,
        tanggal: terbaru.tanggal, hari: ambilHariNama(terbaru.tanggal),
        angka4: urai.asli,
        d2: urai.d2, t2: urai.t2, b2: urai.b2,
        shio_d2: cariShio(urai.d2), shio_t2: cariShio(urai.t2), shio_b2: cariShio(urai.b2),
        jumlah_d2: jumlahAngka(urai.d2), jumlah_t2: jumlahAngka(urai.t2), jumlah_b2: jumlahAngka(urai.b2),
        libur: isLibur(p.kode, terbaru.tanggal), prediksi: pred
      });
      prediksiDaftar.push({pasaran:p.kode, pred:pred});
    }

    // Tampil Hasil Terbaru
    document.getElementById('hasilGrid').innerHTML = hasilAkhir.map(h=>`
      <div class="pasaran-card ${h.libur?'libur':''}">
        <div class="label">${h.pasaran} — ${h.nama}</div>
        <div>${h.tanggal} | ${h.hari}</div>
        <div class="angka">${h.angka4}</div>
        ${h.libur?'<div class="teks-merah">⚠️ Libur</div>':'<div class="teks-hijau">✅ Buka</div>'}
        <div class="baris"><span>2DD:</span><span>${h.d2} | ${h.shio_d2} | Jml:${h.jumlah_d2}</span></div>
        <div class="baris"><span>2DT:</span><span>${h.t2} | ${h.shio_t2} | Jml:${h.jumlah_t2}</span></div>
        <div class="baris"><span>2DB:</span><span>${h.b2} | ${h.shio_b2} | Jml:${h.jumlah_b2}</span></div>
      </div>`).join('');

    // Tampil PREDIKSI
    document.getElementById('prediksiGrid').innerHTML = prediksiDaftar.filter(p=>p.pred).map(h=>`
      <div class="pasaran-card prediksi">
        <div class="label teks-biru">🔮 ${h.pasaran} — PREDIKSI BERIKUTNYA</div>
        <div class="angka teks-biru">${h.pred.prediksi_4d}</div>
        <div class="baris pred">
          <span>2DD:</span>
          <span>${h.pred.pred_dd.angka} | ${cariShio(h.pred.pred_dd.angka)} | Jml:${jumlahAngka(h.pred.pred_dd.angka)}
            <span class="skor ${skorKelas(h.pred.pred_dd.skor)}">${h.pred.pred_dd.skor}</span>
          </span>
        </div>
        <div class="baris pred">
          <span>2DT:</span>
          <span>${h.pred.pred_dt.angka} | ${cariShio(h.pred.pred_dt.angka)} | Jml:${jumlahAngka(h.pred.pred_dt.angka)}
            <span class="skor ${skorKelas(h.pred.pred_dt.skor)}">${h.pred.pred_dt.skor}</span>
          </span>
        </div>
        <div class="baris pred">
          <span>2DB:</span>
          <span>${h.pred.pred_db.angka} | ${cariShio(h.pred.pred_db.angka)} | Jml:${jumlahAngka(h.pred.pred_db.angka)}
            <span class="skor ${skorKelas(h.pred.pred_db.skor)}">${h.pred.pred_db.skor}</span>
          </span>
        </div>
        <div style="margin-top:8px; font-size:0.85rem; opacity:0.8">
          📊 Data: ${h.pred.jumlah_data} baris | Shio Teratas: ${h.pred.shio_teratas.d2[0]} / ${h.pred.shio_teratas.t2[0]} / ${h.pred.shio_teratas.b2[0]}
        </div>
      </div>`).join('');

    // Rekap
    document.getElementById('rekapBagian').innerHTML = `
      <div class="baris" style="font-weight:bold; background:#2a2a2a; padding:8px">
        <span>Pasaran</span><span>2DD | Shio | Jml</span><span>2DT | Shio | Jml</span><span>2DB | Shio | Jml</span><span>Prediksi</span>
      </div>` + hasilAkhir.map(h=>`
      <div class="baris">
        <span style="font-weight:bold">${h.pasaran}</span>
        <span>${h.d2} ${h.shio_d2} ${h.jumlah_d2}</span>
        <span>${h.t2} ${h.shio_t2} ${h.jumlah_t2}</span>
        <span>${h.b2} ${h.shio_b2} ${h.jumlah_b2}</span>
        <span class="teks-biru">${h.prediksi?.prediksi_4d||"-"}</span>
      </div>`).join('');

    // JSON
    const keluaran = {
      waktu_proses: new Date().toLocaleString('id-ID'),
      urutan_pasaran: PASARAN_DAFTAR.map(p=>p.kode),
      jadwal_libur: Object.fromEntries(PASARAN_DAFTAR.map(p=>[p.kode, p.libur.length===0?"Tidak Ada Libur":p.libur])),
      hasil_terbaru: hasilAkhir.map(h=>({pasaran:h.pasaran, angka:h.angka4, tanggal:h.tanggal})),
      prediksi: prediksiDaftar.filter(p=>p.pred).map(p=>({
        pasaran: p.pasaran,
        angka_4d: p.pred.prediksi_4d,
        pred_dd: p.pred.pred_dd,
        pred_dt: p.pred.pred_dt,
        pred_db: p.pred.pred_db,
        shio_teratas: p.pred.shio_teratas
      }))
    };
    document.getElementById('jsonHasil').textContent = JSON.stringify(keluaran,null,2);

    document.getElementById('status').style.display = 'none';
    document.getElementById('konten').style.display = 'block';

  }catch(err){
    document.getElementById('status').innerHTML = `❌ Kesalahan: ${err.message}`;
    console.error(err);
  }
}

function salinJSON(){
  navigator.clipboard.writeText(document.getElementById('jsonHasil').textContent).then(()=>{
    document.getElementById('pesanSalin').innerHTML='<span class="sukses">✓ Tersalin!</span>';
    setTimeout(()=>document.getElementById('pesanSalin').innerHTML='',2000);
  });
}

document.addEventListener('DOMContentLoaded', mulai);
</script>
</body>
</html>
