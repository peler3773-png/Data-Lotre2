<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ubah Angka dari Web — Dinamis</title>
<style>
:root{--hitam:#050505; --emas:#d4af37; --emas2:#f0c808; --gelap:#1a1a1a; --gelap2:#252525; --teks:#eae0c8}
*{margin:0; padding:0; box-sizing:border-box; font-family:system-ui,sans-serif}
body{background:var(--hitam); color:var(--teks); min-height:100vh; padding:15px}
.wrap{max-width:950px; margin:0 auto}
h1{color:var(--emas); text-align:center; margin:12px 0; font-size:1.35rem}
.card{background:var(--gelap); border:1px solid var(--emas); border-radius:10px; padding:15px; margin:12px 0}
pre{background:#000; padding:15px; border-radius:8px; font-size:0.9rem; line-height:1.8; color:#fff; white-space:pre-wrap; word-break:break-all; max-height:800px; overflow-y:auto; margin:0}
button{background:linear-gradient(135deg,var(--emas),var(--emas2)); color:#000; border:none; padding:9px 14px; border-radius:6px; font-weight:bold; cursor:pointer; margin:4px}
button:hover{transform:scale(1.03)}
select, input{background:var(--gelap2); color:var(--teks); border:1px solid var(--emas); padding:8px 12px; border-radius:6px; font-weight:bold; outline:none; margin:4px; width:90px; text-align:center}
select:focus, input:focus{border-color:var(--emas2); box-shadow:0 0 5px var(--emas)}
.loading{text-align:center; padding:25px; color:var(--emas)}
.tombol-baris{text-align:center; margin:10px; display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap}
.info-kecil{font-size:0.8rem; opacity:0.7; margin-top:4px}
.sudut{background:#222; border:1px solid #444; border-radius:6px; padding:8px; margin:8px 0; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
<h1>🔮 3D DEPAN · 3D BELAKANG — Ubah dari Web</h1>

<div class="sudut">
  <label>Jumlah 2D:</label>
  <input type="number" id="inputTarget" value="90" min="1" max="99">
  <button onclick="terapkanAngka()">✅ Terapkan</button>
  <span class="info-kecil">Sekarang: <b id="nilaiSaatIni">90</b></span>
</div>

<div class="tombol-baris">
  <label>Pasaran:</label>
  <select id="pilihPasaran" onchange="tampilPasaran()">
    <option value="BE">BE — BULLSEYE</option>
    <option value="CLF">CLF — CALIFORNIA</option>
    <option value="NCE">NCE — NORTH CAROLINA</option>
    <option value="SD">SD — SYDNEY</option>
    <option value="SGP">SGP — SINGAPORE</option>
    <option value="PS">PS — PHILIPPINES</option>
    <option value="TM">TM — TENNESSE MORNING</option>
    <option value="TXM">TXM — TEXAS MORNING</option>
    <option value="HK">HK — HONGKONG</option>
  </select>
  <button onclick="mulai()">🔄 Muat Ulang Data</button>
  <span id="terakhirMuat" class="info-kecil">Terakhir: —</span>
</div>

<div id="status" class="loading">⏳ Memuat data & menyusun angka...</div>
<div id="konten" style="display:none">
  <div class="card">
    <h3>📋 Hasil</h3>
    <pre id="kotakTeks"></pre>
  </div>
</div>
</div>

<script>
const DATA_UNDIAN_URL = "https://raw.githubusercontent.com/peler3773-png/Data-Lotre/main/data_undian.txt";
let TARGET_2D = 90; // nilai awal
let semuaData = [];

function urai4Digit(angka4){
  const s = String(angka4).padStart(4,'0');
  return {asli:s, d2:s.slice(0,2), t2:s.slice(1,3), b2:s.slice(2,4)};
}

function ambilSesuai(daftar, hindari){
  const hitung = {};
  daftar.forEach(x => { hitung[x] = (hitung[x] || 0) + 1; });

  const hasil = [];
  const sudah = new Set();

  const urut = Object.entries(hitung)
    .filter(([n]) => n !== hindari)
    .sort((a, b) => a[1] - b[1]);

  for(const [nomor] of urut){
    if(hasil.length >= TARGET_2D) break;
    if(!sudah.has(nomor)){
      hasil.push(nomor);
      sudah.add(nomor);
    }
  }

  for(let i = 0; i <= 99; i++){
    if(hasil.length >= TARGET_2D) break;
    const nomor = String(i).padStart(2, '0');
    if(nomor === hindari) continue;
    if(!sudah.has(nomor)){
      hasil.push(nomor);
      sudah.add(nomor);
    }
  }

  while(hasil.length > TARGET_2D) hasil.pop();
  return hasil;
}

function acak(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buatDepan(ddList, dtList){
  const set = new Set();
  for(const dd of ddList){
    const A = dd[0];
    const D2 = dd[1];
    for(const dt of dtList){
      const T1 = dt[0];
      if(D2 === T1){ set.add(A + dt); }
    }
  }
  return acak([...set]);
}

function buatBelakang(dtList, dbList){
  const set = new Set();
  for(const dt of dtList){
    const C = dt[0];
    const T2 = dt[1];
    for(const db of dbList){
      const B1 = db[0];
      if(T2 === B1){ set.add(C + db); }
    }
  }
  return acak([...set]);
}

function proses(dataPasaran){
  if(dataPasaran.length < 3) return null;
  const d2 = [], t2 = [], b2 = [];
  for(const r of dataPasaran){
    const u = urai4Digit(r.angka);
    d2.push(u.d2);
    t2.push(u.t2);
    b2.push(u.b2);
  }
  const terakhir = urai4Digit(dataPasaran[0].angka);

  const dd = ambilSesuai(d2, terakhir.d2);
  const dt = ambilSesuai(t2, terakhir.t2);
  const db = ambilSesuai(b2, terakhir.b2);

  const depan = buatDepan(dd, dt);
  const belakang = buatBelakang(dt, db);

  return {terakhir, dd, dt, db, depan, belakang};
}

async function muat(url){
  const res = await fetch(url, {cache:'no-store'});
  if(!res.ok) throw new Error("Gagal ambil data");
  return res.text();
}

function parse(teks){
  return teks.trim().split('\n').filter(b => b.trim()).map(b => {
    const p = b.split('|');
    return {pasaran:p[0].trim(), tanggal:p[1].trim(), angka:String(p[2]).padStart(4,'0')};
  }).sort((a,b) => a.tanggal.localeCompare(b.tanggal)).reverse();
}

function tampilPasaran(){
  const kode = document.getElementById('pilihPasaran').value;
  const data = semuaData.filter(x => x.pasaran === kode);
  const h = proses(data);

  if(!h){
    document.getElementById('kotakTeks').textContent = "⚠️ Data kurang, minimal 3 baris";
    return;
  }

  let out = `${kode} Terakhir: ${h.terakhir.asli}\n\n`;
  out += `-- ${TARGET_2D} 2DD (${h.dd.length}) --\n${h.dd.join('*')}\n\n`;
  out += `-- ${TARGET_2D} 2DT (${h.dt.length}) --\n${h.dt.join('*')}\n\n`;
  out += `-- ${TARGET_2D} 2DB (${h.db.length}) --\n${h.db.join('*')}\n\n`;
  out += `-- 3D DEPAN ${h.depan.length} LN --\n`;
  out += `Rumus: 2DD[0] + 2DT | Syarat: 2DD[1] = 2DT[0]\n`;
  out += `Contoh: 14 + 43 = 143 (4=4 ✅) | 14 + 12 = TDK BISA (4≠1)\n`;
  out += h.depan.join('*') + `\n\n`;
  out += `-- 3D BELAKANG ${h.belakang.length} LN --\n`;
  out += `Rumus: 2DT[0] + 2DB | Syarat: 2DT[1] = 2DB[0]\n`;
  out += `Contoh: 14 + 43 = 143 (4=4 ✅) | 14 + 12 = TDK BISA (4≠1)\n`;
  out += h.belakang.join('*');

  document.getElementById('kotakTeks').textContent = out;
}

// === UBAH ANGKA DARI WEB ===
function terapkanAngka(){
  const nilaiBaru = parseInt(document.getElementById('inputTarget').value) || 90;
  // Batasi 1–99
  TARGET_2D = Math.max(1, Math.min(99, nilaiBaru));
  document.getElementById('inputTarget').value = TARGET_2D;
  document.getElementById('nilaiSaatIni').textContent = TARGET_2D;
  // Langsung perbarui hasil
  tampilPasaran();
}

async function mulai(){
  try{
    document.getElementById('status').style.display = 'block';
    document.getElementById('konten').style.display = 'none';
    document.getElementById('status').innerHTML = '⏳ Memuat data...';
    semuaData = parse(await muat(DATA_UNDIAN_URL));
    document.getElementById('terakhirMuat').textContent = 'Terakhir: ' + new Date().toLocaleString('id-ID');
    document.getElementById('status').style.display = 'none';
    document.getElementById('konten').style.display = 'block';
    tampilPasaran();
  }catch(err){
    document.getElementById('status').innerHTML = `❌ ${err.message}`;
  }
}
document.addEventListener('DOMContentLoaded', mulai);
</script>
</body>
</html>
